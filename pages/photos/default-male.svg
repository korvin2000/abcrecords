<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400" role="img" aria-label="Portrait not available">
  <title>Portrait not available</title>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0e6c8"/>
      <stop offset="1" stop-color="#dcc99b"/>
    </linearGradient>
  </defs>

  <rect width="300" height="400" fill="url(#paper)"/>

  <!-- double border: accent outside, archival brown inside -->
  <rect x="10" y="10" width="280" height="380" fill="none" stroke="#41506b" stroke-width="1.5" opacity="0.6"/>
  <rect x="16" y="16" width="268" height="368" fill="none" stroke="#54381e" stroke-width="0.7" opacity="0.4"/>

  <!-- medallion -->
  <circle cx="150" cy="165" r="78" fill="none" stroke="#41506b" stroke-width="0.6" opacity="0.35"/>
  <circle cx="150" cy="165" r="72" fill="none" stroke="#41506b" stroke-width="1.2" opacity="0.55"/>

  <!-- engraved bust silhouette, clipped to the medallion -->
  <clipPath id="medallion"><circle cx="150" cy="165" r="72"/></clipPath>
  <g clip-path="url(#medallion)" fill="#41506b" opacity="0.38">
    <circle cx="150" cy="140" r="30"/>
    <path d="M150 176c-31 0-56 22-61 52v34h122v-34c-5-30-30-52-61-52z"/>
  </g>

  <!-- gender glyph -->
  <text x="150" y="290" text-anchor="middle" font-family="Georgia,serif" font-size="34" fill="#41506b" opacity="0.75">♂</text>

  <!-- closing flourish -->
  <text x="150" y="345" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="#54381e" opacity="0.6">❦</text>
</svg>
